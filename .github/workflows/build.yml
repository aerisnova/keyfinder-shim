name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Creating a release needs write access to repository contents. The default
# GITHUB_TOKEN is read-only, which fails the release step with a 403 long after
# the build has succeeded.
permissions:
  contents: write

jobs:
  build:
    name: Build arm64
    # arm64 only: Ultimate's sidecar is arm64 (PyInstaller with native wheels),
    # so an x86_64 slice would ride inside an app that cannot launch on Intel.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: brew install cmake

      - name: Build
        run: ./build.sh

      - name: Verify
        run: |
          binary=dist/keyfinder-shim-arm64-apple-darwin
          lipo -archs "$binary"
          otool -L "$binary" | tail -n +2
          # Silence must classify as silence.
          [ "$(dd if=/dev/zero bs=4 count=44100 2>/dev/null | ./"$binary" 44100)" = "--" ] \
            || { echo "::error::did not report silence"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyfinder-shim-arm64
          path: dist/keyfinder-shim-arm64-apple-darwin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/keyfinder-shim-arm64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
